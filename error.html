<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found | Eastberg Educational Institution</title>
  <!-- Google Fonts: Montserrat & Poppins[span_0](start_span)[span_0](end_span) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #8C2C3F; /*[span_1](start_span)[span_1](end_span) */
      --accent: #FCB433;  /*[span_2](start_span)[span_2](end_span) */
      --white: #FFFFFF;   /*[span_3](start_span)[span_3](end_span) */
      --surface: #FDF8F9;
      --text-dark: #2B181D;
      --text-muted: #665257;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif; /*[span_4](start_span)[span_4](end_span) */
      background-color: var(--white); /*[span_5](start_span)[span_5](end_span) */
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    h1, h2, .logo {
      font-family: 'Montserrat', sans-serif; /*[span_6](start_span)[span_6](end_span) */
      color: var(--primary); /*[span_7](start_span)[span_7](end_span) */
    }

    /* Header */
    header {
      background-color: var(--white); /*[span_8](start_span)[span_8](end_span) */
      border-bottom: 2px solid var(--surface);
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      text-decoration: none;
    }

    .logo span {
      color: var(--accent); /*[span_9](start_span)[span_9](end_span) */
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.75rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--primary); /*[span_10](start_span)[span_10](end_span) */
    }

    .btn-apply {
      background-color: var(--accent); /*[span_11](start_span)[span_11](end_span) */
      color: var(--primary) !important; /*[span_12](start_span)[span_12](end_span) */
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-weight: 600 !important;
    }

    /* Main 404 Section */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      text-align: center;
    }

    .error-box {
      max-width: 580px;
      background-color: var(--surface);
      border-top: 5px solid var(--primary); /*[span_13](start_span)[span_13](end_span) */
      border-radius: 12px;
      padding: 3rem 2rem;
      box-shadow: 0 6px 20px rgba(140, 44, 63, 0.06);
    }

    .error-code {
      font-family: 'Montserrat', sans-serif; /*[span_14](start_span)[span_14](end_span) */
      font-size: 5.5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--primary); /*[span_15](start_span)[span_15](end_span) */
      margin-bottom: 0.5rem;
    }

    .error-code span {
      color: var(--accent); /*[span_16](start_span)[span_16](end_span) */
    }

    .error-box h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }

    .error-box p {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 2rem;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-home {
      background-color: var(--primary); /*[span_17](start_span)[span_17](end_span) */
      color: var(--white); /*[span_18](start_span)[span_18](end_span) */
      text-decoration: none;
      padding: 0.75rem 1.6rem;
      border-radius: 6px;
      font-family: 'Montserrat', sans-serif; /*[span_19](start_span)[span_19](end_span) */
      font-weight: 700;
      font-size: 0.9rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-home:hover {
      background-color: var(--accent); /*[span_20](start_span)[span_20](end_span) */
      color: var(--primary); /*[span_21](start_span)[span_21](end_span) */
    }

    .btn-secondary {
      background-color: var(--white); /*[span_22](start_span)[span_22](end_span) */
      color: var(--primary); /*[span_23](start_span)[span_23](end_span) */
      border: 1.5px solid var(--primary); /*[span_24](start_span)[span_24](end_span) */
      text-decoration: none;
      padding: 0.75rem 1.6rem;
      border-radius: 6px;
      font-family: 'Montserrat', sans-serif; /*[span_25](start_span)[span_25](end_span) */
      font-weight: 700;
      font-size: 0.9rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: var(--primary); /*[span_26](start_span)[span_26](end_span) */
      color: var(--white); /*[span_27](start_span)[span_27](end_span) */
    }

    /* Footer */
    footer {
      background-color: var(--primary); /*[span_28](start_span)[span_28](end_span) */
      color: var(--white); /*[span_29](start_span)[span_29](end_span) */
      text-align: center;
      padding: 1.75rem 1.5rem;
      font-size: 0.9rem;
    }

    footer span {
      color: var(--accent); /*[span_30](start_span)[span_30](end_span) */
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 4rem;
      }
      nav ul {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">EAST<span>BERG</span></a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="course grid.html">Courses</a></li>
          <li><a href="contact us.html">Contact</a></li>
          <li><a href="index.html#admissions" class="btn-apply">Apply Now</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main 404 Content -->
  <main>
    <div class="error-box">
      <div class="error-code">4<span>0</span>4</div>
      <h1>Page Not Found</h1>
      <p>Sorry, the page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
      <div class="action-buttons">
        <a href="index.html" class="btn-home">Back to Home</a>
        <a href="course grid.html" class="btn-secondary">Explore Courses</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 <span>Eastberg Educational Institution</span>. All Rights Reserved.</p>
  </footer>

</body>
</html>
